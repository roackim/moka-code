[project]
name = "moka-code"
version = "0.8.0"
description = "Local llm cli agent"
requires-python = ">= 3.10"
authors = [{name = "Joackim Orciere", email = "joackim.orciere@proton.me"}]
dependencies = [
    "toml",
    "httpx",  # Only HTTP client — the OpenAI/llama.cpp/Ollama/OpenRouter
              # chat transport is implemented directly on httpx (no openai SDK).
    
    # Pinned dependencies for stability and avoiding supply-chain issues
    # > Theses packages do not have dependencies of their own so we can safely pin them 
    "pathspec == 1.0.4", # For .gitignore parsing
    "wcwidth == 0.6.0",  # For accurate character width calculation in the terminal
]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist"]
dev = ["vulture"]

[project.scripts]
moka = "moka_code.main:main"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {include = ["moka_code*"]}}

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
moka-code = { path = ".", editable = true, extras = ["git"] }

[tool.pixi.tasks]
tests = "pytest test/"
app = "python moka_code/main.py"

[tool.pixi.dependencies]
ipykernel = "*"
pytest = "*"
# pytest-html = "*"
# matplotlib-base = "*"
pytest-xdist = "*"
# pillow = "*"
# openai = "*"
toml = "*"
wcwidth = "==0.6.0"
vulture = "*"

[tool.pytest.ini_options]
testpaths = ["test"]
